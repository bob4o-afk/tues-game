name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# едно качване към Pages наведнъж; новото бутва старото
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Тестове
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Тестове
        run: npm test

  deploy:
    name: Публикуване в GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Сглобяване на dist/
        run: npm run build

      # Изисква Pages да е включен веднъж ръчно:
      # Settings → Pages → Source: GitHub Actions
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          include-hidden-files: true   # иначе .nojekyll отпада

      - id: deployment
        uses: actions/deploy-pages@v5
